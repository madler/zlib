name: anyVM-OSes

on: [push, pull_request]

permissions:
  contents: read

jobs:

  dragonflybsd:
    runs-on: ubuntu-latest
    name: DragonflyBSD
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - name: DragonflyBSD
      uses: vmactions/dragonflybsd-vm@4ba8127bd95c94b66fc4b885e37c99955ba308ea # v1
      with:
        copyback: false
        prepare: |
          pkg install -y cmake gcc14 bzip2

        run: |
          cmake . -B build -DZLIB_BUILD_MINIZIP=ON -DMINIZIP_ENABLE_BZIP2=ON
          cmake --build build/
          ctest --test-dir build --output-on-failure

  freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
          - name: x86_64
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - name: FreeBSD - ${{ matrix.name }}
      uses: vmactions/freebsd-vm@a6de9343ef5747433d9c25784c90e84998b9d69a # v1
      with:
        arch: ${{ matrix.name }}
        copyback: false
        release: "15.0"
        prepare: |
          pkg install -y cmake gcc14 bzip2

        run: |
          cmake . -B build -DZLIB_BUILD_MINIZIP=ON -DMINIZIP_ENABLE_BZIP2=ON
          cmake --build build/
          ctest --test-dir build --output-on-failure -E .*summary

  netbsd:
    runs-on: ubuntu-latest
    name: NetBSD - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
          - name: x86_64
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - name: NetBSD - ${{ matrix.name }}
      uses: vmactions/netbsd-vm@99816dccf75edf233ed6cd00a159e3a5b85ea373 # v1
      with:
        copyback: false
        prepare: |
          export PATH="/usr/pkg/sbin:/usr/pkg/bin:$PATH"
          export PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages"
          export PKG_PATH="$PKG_PATH/$(uname -s)/$(uname -m)/$(uname -r|cut -f '1 2' -d.)/All"
          /usr/sbin/pkg_add cmake
          /usr/sbin/pkg_add bzip2

        run: |
          cmake . -B build -DZLIB_BUILD_MINIZIP=ON -DMINIZIP_ENABLE_BZIP2=ON
          cmake --build build/
          ctest --test-dir build --output-on-failure

  omni-os:
    runs-on: ubuntu-latest
    name: OmniOS
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - name: OmniOS
      uses: vmactions/omnios-vm@7f2be0b927aad1a78498c8aeeac4c4ce1fabd322 # v1
      with:
        copyback: false
        prepare: |
          pkg install cmake gcc14 make bzip2

        run: |
          cmake . -B build -DZLIB_BUILD_MINIZIP=ON -DMINIZIP_ENABLE_BZIP2=ON
          cmake --build build/
          ctest --test-dir build --output-on-failure

  openbsd:
    runs-on: ubuntu-latest
    name: OpenBSD - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
          - name: x86_64
          - name: riscv64
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - name: OpenBSD - ${{ matrix.name }}
      uses: vmactions/openbsd-vm@fcf799d7ce9c305ad89eabef1fb2fa5c1c42d0ee # v1
      with:
        arch: ${{ matrix.name }}
        copyback: false
        prepare: |
          pkg_add cmake
          bzip2

        run: |
          cmake . -B build -DZLIB_BUILD_MINIZIP=ON -DMINIZIP_ENABLE_BZIP2=ON
          cmake --build build/
          ctest --test-dir build

